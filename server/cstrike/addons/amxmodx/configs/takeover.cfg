// takeover.cfg — AMXX Bot Takeover plugin configuration
// Install to addons/amxmodx/configs/ — the plugin exec's this file automatically.

// Master on/off switch for the takeover feature.
takeover_enabled "1"

// Death-cam seconds to wait after dying before the takeover hint appears and
// the confirm key starts being accepted.
takeover_delay "5.0"

// Seconds to freeze the player in place right after taking over a body, so they
// orient before moving (prevents acting on the instant-respawn frame / getting
// stuck). 0 disables the freeze.
takeover_freeze "1"

// What happens to the bot that gets taken over:
//   0 = silently kill it — no kill-feed line, no corpse where you land, and no
//       death scored; it stays on the team and respawns next round with its
//       scoreboard untouched (recommended)
//   1 = kick it from the server entirely (its slot is usually refilled by a
//       fresh 0-score bot, which churns the scoreboard)
takeover_bot_mode "0"

// Confirm key the dead player presses to take over a bot.
// One of: attack, attack2, jump, duck, use, reload
//   reload (R) is the default. While dead you are a spectator, and the engine's
//   observer camera consumes some buttons for its own controls: attack (MOUSE1)
//   cycles the spectated player, attack2 (MOUSE2) goes back one, jump (SPACE)
//   changes camera mode. reload has no spectator function at all, so it is the
//   cleanest, most reliable pick. use (E) also works but may flash a harmless
//   "Picture in Picture is not available" client message.
takeover_key "reload"

// Troubleshooting: 1 = log takeover diagnostics to the server console AND to the
// dead player's chat (offer open/close, the buttons the engine reports each
// frame, key matches, and why a takeover aborted). Leave 0 in production.
takeover_debug "0"

// Repeat policy:
//   1 = take over again on every later death while teammate bots remain (CS:GO casual)
//   0 = only one takeover per round
//   N = cap of N takeovers per round
takeover_repeat "1"

// Which teammate bot is taken over:
//   0 = random   1 = nearest to where you died   2 = lowest HP   3 = highest HP
takeover_select "1"

// 1 = rename the player to the bot's name (off by default — can confuse the scoreboard).
takeover_adopt_name "0"

// 1 = copy the bot's player model so the body looks consistent.
takeover_adopt_model "1"

// Health transferred on takeover:
//   0 = copy the bot's exact HP/armor (CS:GO-accurate)
//   1 = full 100 HP, no armor
//   2 = copy the bot's HP but cap it at 100
takeover_health_mode "0"

// Re-send the fading takeover hint every N seconds while the offer is open (0 = once).
takeover_hint_repeat "1.0"

// Optional floor: do not offer a takeover if it would drop the team's alive bot
// count to <= this value. 0 = no floor, so players may take over the team's very
// last bot (the round no longer ends when the last bot is taken — the player is
// respawned before the bot leaves the round). Raise this only if you deliberately
// want some bots kept playing each round.
takeover_min_bots "0"

// 1 = if a player survives the round inside a taken-over bot body, reset them to a
// default loadout (knife + default pistol, no armor/grenades) at the start of the
// next round, so the borrowed bot kit does not carry over. Money is untouched —
// they rebuy in freeze time like anyone who died. 0 = keep the bot kit (casual).
takeover_strip_on_survive "1"
