# CS 1.6 dedicated server (Linux ReHLDS inside the container).
# Game files live in server/cstrike; image build lives in docker/.
#
# Setup:
#   copy server\.env.example server\.env
# First start (SteamCMD + ReHLDS, 10–20 min):
#   docker compose --env-file server/.env up --build -d
# Logs / stop:
#   docker compose logs -f
#   docker compose down

services:
  cs16:
    build:
      context: ./docker
      dockerfile: Dockerfile
      additional_contexts:
        server: ./server
    image: cs16-server:local
    container_name: cs16
    platform: linux/amd64
    restart: no
    stdin_open: true
    tty: true
    env_file:
      - path: .env.example
        required: true
      - path: ./server/.env
        required: false
    ports:
      - "${PORT:-27015}:27015/udp"
      - "${PORT:-27015}:27015/tcp"
    environment:
      CS_HOSTNAME: ${CS_HOSTNAME:-Counter-Strike 1.6 Server}
      MAXPLAYERS: ${MAXPLAYERS:-32}
      START_MAP: ${START_MAP:-de_dust2}
      PORT: ${PORT:-27015}
      RCON_PASSWORD: ${RCON_PASSWORD:-}
      SV_PASSWORD: ${SV_PASSWORD:-}
      CPU_MHZ: ${CPU_MHZ:-2300}
    volumes:
      - ./server/cstrike:/custom:ro
      - ./users.ini:/run/secrets/users.ini:ro
      - cs16-logs:/opt/hlds/cstrike/logs
      - cs16-amxx-logs:/opt/hlds/cstrike/addons/amxmodx/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cs16-logs:
  cs16-amxx-logs:
